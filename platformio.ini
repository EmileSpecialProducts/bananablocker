[platformio]
src_dir = ./BananaBlocker
data_dir = ./Littlefs

[env]
platform32 = https://github.com/pioarduino/platform-espressif32.git#prep_IDF6
;espressif32
;https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
;https://github.com/pioarduino/platform-espressif32.git#prep_IDF6
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder ,time
extra_scripts = Scripts/extra_script.py

[env:esp12e]
platform = espressif8266
board = esp12e
board_build.ldscript = eagle.flash.4m2m.ld
lib_deps =
    ${env.lib_deps}
;upload_flags= --auth="admin"
;upload_protocol = espota
;upload_port=ESP-LittleFS-12E.local ;192.168.5.14

[env:esp32_4MB]
platform = ${env.platform32}
lib_deps =
    ${env.lib_deps}
board = esp32dev
board_build.partitions = partitions/no_ota_large_spiffs_4MB.csv
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304

; WEMOS LOLIN S2 PICO
[env:esp32s2_4MB]
platform = ${env.platform32}
lib_deps =
    ${env.lib_deps}
board = lolin_s2_pico
board_build.partitions = partitions/no_ota_large_spiffs_4MB.csv
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304

[env:esp32s3_4MB]
platform = ${env.platform32}
lib_deps =
    ${env.lib_deps}
build_flags = 
    ${env.build_flags}
;    -DARDUINO_USB_MODE=1
;    -DARDUINO_USB_CDC_ON_BOOT=1
board = esp32-s3-devkitc-1
board_build.partitions = partitions/no_ota_large_spiffs_4MB.csv
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304

[env:esp32s31_4MB]
platform = ${env.platform32}
lib_deps =
    ${env.lib_deps}
build_flags = 
    ${env.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
; https://docs.espressif.com/projects/esp-dev-kits/en/latest/esp32s31/esp32-s31-function-coreboard-1/index.html
board = esp32-s31-coreboard-1
board_build.partitions = partitions/no_ota_large_spiffs_4MB.csv
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304

[env:esp32c2_4MB]
platform = ${env.platform32}
lib_deps =
    ${env.lib_deps}
build_flags = 
    ${env.build_flags}
board = esp32-c2-devkitm-1
board_build.partitions = partitions/no_ota_large_spiffs_4MB.csv
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304

[env:esp32c3_4MB]
platform = ${env.platform32}
lib_deps =
    ${env.lib_deps}
board = esp32-c3-devkitc-02
; As i was using a https://wiki.luatos.org/chips/esp32c3/board.html that has no RS232 chip only USB
build_flags = 
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
;board_build.flash_mode = dio ; set the flash mode to as slow as posible so that it will support all board
board_build.partitions = partitions/no_ota_large_spiffs_4MB.csv
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304

[env:esp32c5_4MB]
platform = ${env.platform32}
lib_deps =
    ${env.lib_deps}
build_flags = 
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
board = esp32-c5-devkitc-1
board_build.partitions = partitions/no_ota_large_spiffs_4MB.csv
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304

[env:esp32c6_4MB]
platform = ${env.platform32}
lib_deps =
    ${env.lib_deps}
build_flags = 
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
board = esp32-c6-devkitc-1
board_build.partitions = partitions/no_ota_large_spiffs_4MB.csv
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304

[env:esp32c61_4MB]
platform = ${env.platform32}
lib_deps =
    ${env.lib_deps}
build_flags = 
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
board = esp32-c61-devkitc1-n8r2
board_build.partitions = partitions/no_ota_large_spiffs_4MB.csv
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304

[env:esp32s3-OTA-16MB]
platform = ${env.platform32}
lib_deps =
    ${env.lib_deps}
build_flags = 
    ${env.build_flags}
    -D OTA_UPDATE
;    -DARDUINO_USB_MODE=1
;    -DARDUINO_USB_CDC_ON_BOOT=1
board = esp32-s3-devkitc-1
board_build.partitions = partitions/spiffs_16MB.csv
board_upload.flash_size=16MB
board_upload.maximum_size=16777216
;upload_flags= --auth="Banana"
;upload_protocol = espota
;upload_port=BananaBlocker.local ;192.168.5.45